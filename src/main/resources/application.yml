spring:
  application:
    name: mention-notification-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:oracle:thin:@asirialwis_high?TNS_ADMIN=${ORACLE_WALLET_PATH}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-test-query: SELECT 1 FROM DUAL

  jpa:
    hibernate:
      ddl-auto: validate # Keeps schema validation strict
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: ADMIN

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 25

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8081:8080" # Mapped to 8081 so it doesn't conflict with Spring Boot on 8080
    command: start-dev # Runs Keycloak in development mode (no HTTPS required)
    networks:
      - app-network

  security:
    oauth2:
      resourceserver:
        jwt:
          # Points to the 'messaging-realm' will create in Keycloak
          issuer-uri: http://localhost:8081/realms/messaging-realm

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: method
      doc-expansion: none # Keep endpoints collapsed by default for better UX