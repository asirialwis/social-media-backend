spring:
  application:
    name: mention-notification-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:oracle:thin:@asirialwis_high?TNS_ADMIN=${ORACLE_WALLET_PATH}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-test-query: SELECT 1 FROM DUAL

  jpa:
    hibernate:
      ddl-auto: validate # Keeps schema validation strict
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: ADMIN

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 25

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: method
      doc-expansion: none # Keep endpoints collapsed by default for better UX